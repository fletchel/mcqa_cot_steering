# Pilot: Qwen3-32B — standard-attention control for Qwen3.6-27B (2x H100 bf16)
# 500 pairs (250 per dataset) -> ~415 train, 0 dev, ~85 test
# No dev split: steering stages fall back to all-layers ("Lall") configs.
model_name: Qwen/Qwen3-32B
datasets: [mmlu, hellaswag]
num_datapoints_per_dataset: 250
seed: 42

filtering:
  min_confidence: 0.0
  min_choice_tokens: 1
  max_choice_tokens: 999
  skip_negated: true

split:
  train_fraction: 0.833
  dev_fraction: 0.0
  test_fraction: 0.167

direction:
  offsets: [-3, -2, -1, 0]
  adaptive_offsets: true

patching:
  offsets: [-3, -2, -1, 0]
  batch_size: 8
  max_pairs: 400

steering:
  offsets: [-3, -2, -1, 0]
  alphas: [0.0, 1.0, 2.0, 3.0]
  logit_batch_size: 16
  cot_alpha: 2.0
  cot_batch_size: 16
  cot_max_new_tokens: 8192

layer_sweeps:
  num_datapoints: 50
  window_size: 5

load_in_8bit: false
load_in_4bit: false
cache_dir: /scratch-shared/lfletcher/huggingface/hub
