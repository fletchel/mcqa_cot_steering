# Smoke test: Qwen3.6-27B machinery check only (2x A100, ~30-45 min)
# 50 pairs (25 per dataset) -> ~42 train, 0 dev, ~8 test
# Multimodal wrapper (Qwen3_5ForConditionalGeneration) + hybrid DeltaNet stack, 64 layers.
# Pre-CoT prompts get an empty <think></think> block automatically via the chat template.
model_name: Qwen/Qwen3.6-27B
datasets: [mmlu, hellaswag]
num_datapoints_per_dataset: 25
seed: 42

filtering:
  min_confidence: 0.0
  min_choice_tokens: 1
  max_choice_tokens: 999
  skip_negated: true

split:
  train_fraction: 0.833
  dev_fraction: 0.0
  test_fraction: 0.167

direction:
  offsets: [-3, -2, -1, 0]
  adaptive_offsets: true

patching:
  offsets: [-3, -2, -1, 0]
  batch_size: 8
  max_pairs: 20

steering:
  offsets: [-3, -2, -1, 0]
  alphas: [0.0, 2.0]
  logit_batch_size: 8
  cot_alpha: 2.0
  cot_batch_size: 24
  cot_max_new_tokens: 16384  # high budget to calibrate Qwen3.6 thinking length

layer_sweeps:
  num_datapoints: 20
  window_size: 5

load_in_8bit: false
load_in_4bit: false
cache_dir: /scratch-shared/lfletcher/huggingface/hub
