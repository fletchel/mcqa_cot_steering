# Big run: Gemma 2 9B, 2500 train + 500 test per dataset
model_name: google/gemma-2-9b-it
datasets: [mmlu, hellaswag]
num_datapoints_per_dataset: 3500
seed: 42

filtering:
  min_confidence: 0.0
  min_choice_tokens: 1
  max_choice_tokens: 999
  skip_negated: true

split:
  train_fraction: 0.714
  dev_fraction: 0.143
  test_fraction: 0.143

direction:
  offsets: [-3, -2, -1, 0]
  adaptive_offsets: true

patching:
  offsets: [-3, -2, -1, 0]
  batch_size: 8
  max_pairs: 500

steering:
  offsets: [-3, -2, -1, 0]
  alphas: [0.0, 1.0, 2.0]
  logit_batch_size: 16
  cot_alpha: 2.0
  cot_batch_size: 16

layer_sweeps:
  num_datapoints: 250
  window_size: 5

load_in_8bit: false
load_in_4bit: false
cache_dir: null
